# Release build: on a tag push, verify the tag against package.json, build
# both distributions with the version injected, and attach them.
#
# - amc-dist-v<V>.zip — the full PWA build. Must be SERVED (any static host
#                       or `npx serve dist`); double-clicking its index.html
#                       gives the degraded file:// mode, no service worker.
# - AMC-v<V>.html     — the single-file build. Opens directly from disk.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Bump package.json (or retag) so the release is not mislabelled."
            exit 1
          fi
          echo "AMC_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "Releasing AMC v$PKG_VERSION"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (served PWA)
        run: npm run build

      - name: Build (single file)
        run: npm run build:file

      - name: Package
        run: |
          cd dist && zip -r "../amc-dist-v${AMC_VERSION}.zip" . && cd ..
          cp dist-file/index.html "AMC-v${AMC_VERSION}.html"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            amc-dist-v*.zip
            AMC-v*.html
          body: |
            **amc-dist-v*.zip** — the full PWA build. Serve it (`npx serve dist` or any static host); it installs offline and carries the /api proxies when deployed to Vercel. Double-clicking its index.html is not supported.

            **AMC-v*.html** — the single-file build. Opens directly from disk with no server. Folder access is read-only there and catalog/lyrics lookups go through music.thesupersupersigma.com while online.
